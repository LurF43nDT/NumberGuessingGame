<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section class="card">
            <div class="card__header">
                <p class="eyebrow">Mini Game</p>
                <h1>Find the Hidden Cell</h1>
                <p class="subtitle">Click a cell on the 8x8 grid (A-H rows, 1-8 columns) to find the secret spot.</p>
            </div>

            <div class="grid-wrapper">
                <div id="grid" class="grid" aria-label="Guessing grid"></div>
            </div>

            <div class="feedback">
                <p id="message">Start guessing to get feedback.</p>
                <div class="meta">
                    <span id="attempts">Attempts: 0</span>
                    <span id="rangeHint">Valid: A-H followed by 1-8</span>
                </div>
            </div>

            <div class="actions">
                <button id="resetBtn" type="button" class="secondary">Restart Game</button>
            </div>

            <div id="videoContainer" class="video hidden">
                <video id="winVideo" width="640" height="360" controls>
                    <source src="slått-kattepus.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
